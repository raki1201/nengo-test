<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>年号テスト</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    button { touch-action: manipulation; cursor: pointer; }
    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 {
      font-size: 1.8rem;
      color: #5c3d2e;
      margin: 20px 0 8px;
      letter-spacing: 0.1em;
    }
    .subtitle { color: #8d6e63; font-size: 0.85rem; margin-bottom: 24px; }

    /* Mode select */
    #mode-screen {
      background: white;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
    }
    #mode-screen h2 { color: #5c3d2e; margin-bottom: 24px; font-size: 1.1rem; }
    .mode-btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-bottom: 12px;
      border: 2px solid #d4a373;
      border-radius: 12px;
      background: white;
      color: #5c3d2e;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn:hover { background: #d4a373; color: white; }
    .mode-desc { font-size: 0.8rem; font-weight: normal; color: #8d6e63; margin-top: 4px; }
    .range-select {
      margin: 16px 0;
      text-align: left;
    }
    .range-select label { color: #5c3d2e; font-size: 0.9rem; display: block; margin-bottom: 8px; }
    .range-select select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d4a373;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #5c3d2e;
      background: white;
    }
    .shuffle-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 12px 0;
      color: #5c3d2e;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .shuffle-toggle input { width: 18px; height: 18px; cursor: pointer; }

    /* Quiz screen */
    #quiz-screen { width: 100%; max-width: 480px; display: none; }
    .progress-bar-wrap {
      background: #e0d5c1;
      border-radius: 99px;
      height: 8px;
      margin-bottom: 20px;
    }
    .progress-bar {
      background: #d4a373;
      height: 8px;
      border-radius: 99px;
      transition: width 0.3s;
    }
    .progress-text {
      text-align: right;
      font-size: 0.8rem;
      color: #8d6e63;
      margin-bottom: 16px;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      margin-bottom: 20px;
    }
    .question-num { color: #8d6e63; font-size: 0.85rem; margin-bottom: 12px; }
    .event-name {
      font-size: 1.5rem;
      font-weight: bold;
      color: #3e2723;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .event-desc {
      font-size: 0.85rem;
      color: #8d6e63;
      line-height: 1.6;
      margin-bottom: 22px;
      background: #faf6f0;
      border-radius: 8px;
      padding: 10px 12px;
      text-align: left;
    }
    .year-input-wrap { display: flex; gap: 10px; justify-content: center; margin-top: 4px; }
    .year-input {
      width: 140px;
      padding: 14px;
      font-size: 1.3rem;
      text-align: center;
      border: 2px solid #d4a373;
      border-radius: 10px;
      color: #3e2723;
      outline: none;
      transition: border-color 0.2s;
      -webkit-appearance: none;
    }
    .year-input:focus { border-color: #a0522d; }
    .year-input.correct { border-color: #4caf50; background: #f1f8e9; }
    .year-input.wrong   { border-color: #f44336; background: #fdecea; }
    .submit-btn {
      padding: 14px 18px;
      background: #a0522d;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: bold;
      touch-action: manipulation;
      cursor: pointer;
    }
    .submit-btn:disabled { background: #ccc; cursor: default; }
    .reverse-year {
      font-size: 2.8rem;
      font-weight: bold;
      color: #5c3d2e;
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }
    .choices {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    .choices-col {
      grid-template-columns: 1fr;
    }
    .choice-btn {
      padding: 16px 8px;
      font-size: 1.1rem;
      font-weight: bold;
      border: 2px solid #d4a373;
      border-radius: 12px;
      background: white;
      color: #3e2723;
      cursor: pointer;
      transition: all 0.15s;
    }
    .choice-btn:hover:not(:disabled) { background: #f5f0e8; }
    .choice-btn.correct {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
    }
    .choice-btn.wrong {
      background: #fdecea;
      border-color: #f44336;
      color: #c62828;
    }
    .choice-btn.reveal {
      background: #e8f5e9;
      border-color: #4caf50;
      color: #2e7d32;
    }
    .choice-btn:disabled { cursor: default; opacity: 0.75; }
    .feedback {
      margin-top: 16px;
      font-size: 1rem;
      font-weight: bold;
      min-height: 28px;
    }
    .feedback.correct { color: #388e3c; }
    .feedback.wrong { color: #d32f2f; }

    /* Study mode */
    .study-card {
      background: white;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      margin-bottom: 16px;
    }
    .study-event { font-size: 1.4rem; font-weight: bold; color: #3e2723; margin-bottom: 16px; }
    .study-year-hidden {
      font-size: 2rem;
      font-weight: bold;
      color: #d4a373;
      background: #f5f0e8;
      border-radius: 10px;
      padding: 12px 32px;
      cursor: pointer;
      display: inline-block;
      transition: all 0.2s;
      user-select: none;
    }
    .study-year-hidden:hover { background: #e8dcc8; }
    .study-year-revealed { color: #5c3d2e; background: #fff8f0; }
    .hint { font-size: 0.8rem; color: #b0a090; margin-top: 8px; }

    /* Navigation */
    .nav-btns {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
    }
    .nav-btn {
      padding: 12px 24px;
      border-radius: 10px;
      border: 2px solid #d4a373;
      background: white;
      color: #5c3d2e;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover { background: #d4a373; color: white; }
    .nav-btn.primary { background: #a0522d; color: white; border-color: #a0522d; }
    .nav-btn.primary:hover { background: #7b3d1e; }

    /* Score screen */
    #score-screen {
      background: white;
      border-radius: 16px;
      padding: 40px 28px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      text-align: center;
      display: none;
    }
    .score-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: #f5f0e8;
      border: 6px solid #d4a373;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .score-num { font-size: 2.4rem; font-weight: bold; color: #5c3d2e; }
    .score-label { font-size: 0.8rem; color: #8d6e63; }
    .score-msg { font-size: 1.1rem; color: #5c3d2e; margin-bottom: 24px; }
    .wrong-list { text-align: left; margin-top: 20px; }
    .wrong-list h3 { color: #d32f2f; margin-bottom: 12px; font-size: 0.95rem; }
    .wrong-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fdecea;
      border-radius: 8px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: #3e2723;
    }
    .wrong-item span { color: #388e3c; font-weight: bold; }
    .wrong-review-box {
      margin-top: 16px;
      border-top: 2px dashed #d4a373;
      padding-top: 16px;
    }
    .wrong-review-box h3 { color: #5c3d2e; font-size: 0.9rem; margin-bottom: 10px; }
    .no-wrong-msg { font-size: 0.8rem; color: #b0a090; margin-bottom: 8px; }
    .wrong-mode-btns { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .wrong-mode-btns .mode-btn {
      background: #fff3e0;
      border-color: #ff8f00;
      color: #bf360c;
    }
    .wrong-mode-btns .mode-btn:hover { background: #ff8f00; color: white; }
    .clear-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: none;
      border: 1px solid #ccc;
      border-radius: 8px;
      color: #999;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .clear-btn:hover { color: #d32f2f; border-color: #d32f2f; }
  </style>
</head>
<body>
  <h1>年号テスト</h1>
  <p class="subtitle">日本史 重要年号 全100問</p>

  <!-- Mode select screen -->
  <div id="mode-screen">
    <h2>モードを選択してください</h2>
    <div class="range-select">
      <label>出題範囲</label>
      <select id="range-select">
        <option value="all">全問（1〜100）</option>
        <option value="1-25">第1部（1〜25問）</option>
        <option value="26-50">第2部（26〜50問）</option>
        <option value="51-75">第3部（51〜75問）</option>
        <option value="76-100">第4部（76〜100問）</option>
      </select>
    </div>
    <label class="shuffle-toggle">
      <input type="checkbox" id="shuffle-check" checked>
      シャッフルして出題
    </label>
    <button class="mode-btn" id="btn-test">
      4択モード（事件→年号）
      <div class="mode-desc">出来事を見て年号を4択で答える</div>
    </button>
    <button class="mode-btn" id="btn-input">
      入力モード（事件→年号）
      <div class="mode-desc">出来事を見て年号を直接入力する</div>
    </button>
    <button class="mode-btn" id="btn-reverse">
      逆引きモード（年号→事件）
      <div class="mode-desc">年号を見て出来事名を4択で答える</div>
    </button>
    <button class="mode-btn" id="btn-study">
      暗記モード
      <div class="mode-desc">タップで年号を確認しながら覚える</div>
    </button>
    <div class="wrong-review-box">
      <h3 id="wrong-review-title">苦手問題（0問）</h3>
      <div class="wrong-mode-btns" id="wrong-mode-btns" style="display:none">
        <button class="mode-btn" id="btn-wrong-4択">
          4択で復習
          <div class="mode-desc">4択から年号を選ぶ</div>
        </button>
        <button class="mode-btn" id="btn-wrong-input">
          入力で復習
          <div class="mode-desc">年号を直接入力する</div>
        </button>
      </div>
      <p class="no-wrong-msg" id="no-wrong-msg">まだ間違えた問題がありません</p>
      <button class="clear-btn" id="btn-clear-wrong" style="display:none">苦手リストをリセット</button>
    </div>
  </div>

  <!-- Quiz screen -->
  <div id="quiz-screen">
    <div class="progress-text">
      <span id="q-num">1</span> / <span id="q-total">100</span>問
      &nbsp;正解: <span id="score-count">0</span>
    </div>
    <div class="progress-bar-wrap">
      <div class="progress-bar" id="progress-bar" style="width:0%"></div>
    </div>

    <!-- Test mode card -->
    <div class="card" id="test-card">
      <div class="question-num" id="test-q-num">問1</div>
      <div class="event-name" id="event-display"></div>
      <div class="event-desc" id="event-desc"></div>
      <div class="choices" id="choices"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <!-- Input mode card -->
    <div class="card" id="input-card" style="display:none">
      <div class="question-num" id="input-q-num">問1</div>
      <div class="event-name" id="input-event-display"></div>
      <div class="event-desc" id="input-event-desc"></div>
      <div class="year-input-wrap">
        <input type="number" class="year-input" id="year-input" placeholder="西暦年" min="1" max="2100">
        <button class="submit-btn" id="submit-btn">確認</button>
      </div>
      <div class="feedback" id="input-feedback"></div>
    </div>

    <!-- Reverse mode card -->
    <div class="card" id="reverse-card" style="display:none">
      <div class="question-num" id="reverse-q-num">問1</div>
      <div class="reverse-year" id="reverse-year-display"></div>
      <div class="event-desc" id="reverse-desc"></div>
      <div class="choices choices-col" id="reverse-choices"></div>
      <div class="feedback" id="reverse-feedback"></div>
    </div>

    <!-- Study mode card -->
    <div class="study-card" id="study-card" style="display:none">
      <div class="question-num" id="study-q-num">1 / 100</div>
      <div class="study-event" id="study-event"></div>
      <div class="event-desc" id="study-desc" style="margin-bottom:16px;"></div>
      <div class="study-year-hidden" id="study-year" onclick="revealYear()">タップして確認</div>
      <div class="hint">↑ クリックして年号を表示</div>
    </div>

    <div class="nav-btns" id="nav-btns">
      <button class="nav-btn" id="back-btn" style="display:none">◀ 前へ</button>
      <button class="nav-btn primary" id="next-btn" style="display:none">次へ ▶</button>
      <button class="nav-btn" id="btn-menu">メニューへ</button>
    </div>
  </div>

  <!-- Score screen -->
  <div id="score-screen">
    <h2 style="color:#5c3d2e; margin-bottom:24px;">テスト終了！</h2>
    <div class="score-circle">
      <div class="score-num" id="final-score">0</div>
      <div class="score-label">/ <span id="final-total">0</span>問</div>
    </div>
    <div class="score-msg" id="score-msg"></div>
    <div class="nav-btns">
      <button class="nav-btn primary" id="btn-retry">もう一度</button>
    </div>
    <div class="wrong-list" id="wrong-list"></div>
  </div>

<script>
const allQuestions = [
  { id:1,  event:"承久の乱", year:1221, desc:"後鳥羽上皇が鎌倉幕府を倒そうとして失敗した乱。幕府が勝利し上皇は隠岐に流された。" },
  { id:2,  event:"石油危機", year:1973, desc:"中東戦争をきっかけにOPECが石油輸出を制限。日本経済に大打撃を与えた。" },
  { id:3,  event:"外様大名の服属（関ヶ原）", year:1600, desc:"徳川家康と石田三成が争った天下分け目の戦い。家康が勝利し江戸幕府樹立への道を開いた。" },
  { id:4,  event:"安政の大獄", year:1858, desc:"大老・井伊直弼が開国に反対する尊王攘夷派を大弾圧した事件。吉田松陰らが処刑された。" },
  { id:5,  event:"本能寺の変", year:1582, desc:"織田信長が家臣・明智光秀に京都本能寺で討たれた事件。天下統一直前の衝撃的な事件。" },
  { id:6,  event:"鎌倉幕府成立", year:1192, desc:"源頼朝が征夷大将軍に任命され武家政権を樹立。日本初の本格的な武士の政府。" },
  { id:7,  event:"第一回遣唐使", year:630, desc:"唐（中国）の進んだ文化・制度を取り入れるため初めて派遣された使節団。" },
  { id:8,  event:"第二次世界大戦（開始）", year:1939, desc:"ドイツのポーランド侵攻で始まった人類史上最大の戦争。日本も1941年に参戦した。" },
  { id:9,  event:"東京オリンピック", year:1964, desc:"アジア初の夏季オリンピックが東京で開催。戦後復興の象徴となった国際スポーツ大会。" },
  { id:10, event:"第一次世界大戦（開始）", year:1914, desc:"サラエボ事件を引き金に勃発した大規模な世界戦争。日本は連合国側として参戦した。" },
  { id:11, event:"大宝律令", year:701, desc:"刑部親王・藤原不比等らが編纂した日本初の本格的な律令（法律）。天皇中心の国家体制を整えた。" },
  { id:12, event:"日中戦争", year:1937, desc:"盧溝橋事件をきっかけに始まった日本と中国（国民政府）の全面戦争。太平洋戦争終結まで続いた。" },
  { id:13, event:"参勤交代制", year:1635, desc:"諸大名を1年おきに江戸と国元に交互に住まわせた制度。大名の財力を消耗させ反乱を防いだ。" },
  { id:14, event:"日米和親条約", year:1854, desc:"ペリーの圧力により日本が鎖国を解いてアメリカと結んだ条約。下田・函館を開港した。" },
  { id:15, event:"ポツダム宣言受諾", year:1945, desc:"日本が連合国の降伏要求を受け入れ第二次世界大戦が終結。玉音放送で国民に伝えられた。" },
  { id:16, event:"室町幕府成立", year:1338, desc:"足利尊氏が征夷大将軍となり室町幕府を開いた。南北朝の内乱が続く中での幕府成立。" },
  { id:17, event:"日本国憲法成立", year:1946, desc:"戦後の新憲法が公布され主権在民・平和主義・基本的人権の尊重を三大原則として宣言した。" },
  { id:18, event:"平清盛、太政大臣に", year:1167, desc:"武士として初めて太政大臣に就任し平氏政権を確立した。「平家にあらずんば人にあらず」と言われた時代。" },
  { id:19, event:"禁中並公家諸法度", year:1615, desc:"江戸幕府が天皇・公家の行動を細かく規制した法令。天皇を学問に専念させ政治から遠ざけた。" },
  { id:20, event:"日米修好通商条約", year:1858, desc:"日米間で自由貿易を定めた条約。領事裁判権を認め関税自主権がない不平等条約だった。" },
  { id:21, event:"江戸幕府キリスト教禁止", year:1612, desc:"幕府がキリスト教を禁止し信者を迫害し始めた。島原の乱後にはさらに厳しく取り締まられた。" },
  { id:22, event:"大日本帝国憲法発布", year:1889, desc:"アジア初の近代憲法が発布され立憲君主制が始まった。天皇主権で議会・内閣制度も規定された。" },
  { id:23, event:"ラックスマン来航", year:1792, desc:"ロシアが通商を求めて初めて根室に来航した事件。日本の北方に対する危機感が高まるきっかけとなった。" },
  { id:24, event:"対華21か条要求", year:1915, desc:"第一次世界大戦中に日本が中国（袁世凱政府）に突きつけた権益拡大要求。中国で激しい反日運動が起きた。" },
  { id:25, event:"慶安の触書", year:1649, desc:"農民の生活を細かく規制した江戸幕府のお触れ書き。「麦・粟・稗を食べよ」と倹約を強制した。" },
  { id:26, event:"全国水平社", year:1922, desc:"被差別部落民が差別撤廃を求めて設立した解放運動団体。「人の世に熱あれ、人間に光あれ」と宣言した。" },
  { id:27, event:"議会開設の勅諭", year:1881, desc:"明治天皇が10年後に国会を開くと約束した詔勅。大隈重信が政府から追放された「明治十四年の政変」とセット。" },
  { id:28, event:"第一回帝国議会", year:1890, desc:"アジア初の近代議会が開会された。衆議院と貴族院の二院制で、選挙権は高額納税者の男性のみ。" },
  { id:29, event:"版籍奉還", year:1869, desc:"諸大名が土地（版）と人民（籍）を天皇に返還した。中央集権化に向けた明治政府の改革の第一歩。" },
  { id:30, event:"ラジオ放送開始", year:1925, desc:"日本で初めてラジオ放送が開始された（NHKの前身）。情報伝達に革命をもたらしたメディア。" },
  { id:31, event:"鉄道開業", year:1872, desc:"新橋〜横浜間で日本初の鉄道が開通した。蒸気機関車が走り近代化の象徴となった。" },

let questions = [];
let currentIndex = 0;
let score = 0;
let mode = 'test';
let answered = false;
let wrongAnswers = [];
let yearRevealed = false;
let isWrongReview = false;

const STORAGE_KEY = 'nengo_wrong_ids';

function getWrongIds() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
  catch { return []; }
}

function markWrong(id) {
  const ids = getWrongIds();
  if (!ids.includes(id)) { ids.push(id); localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); }
  updateWrongBtn();
}

function markCorrect(id) {
  const ids = getWrongIds().filter(i => i !== id);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(ids));
  updateWrongBtn();
}

function updateWrongBtn() {
  const count = getWrongIds().length;
  document.getElementById('wrong-review-title').textContent = `苦手問題（${count}問）`;
  document.getElementById('wrong-mode-btns').style.display = count > 0 ? 'flex' : 'none';
  document.getElementById('no-wrong-msg').style.display = count === 0 ? 'block' : 'none';
  document.getElementById('btn-clear-wrong').style.display = count > 0 ? 'block' : 'none';
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function startWrongReview(m) {
  const wrongIds = getWrongIds();
  if (wrongIds.length === 0) return;
  isWrongReview = true;
  mode = m;
  questions = shuffle(allQuestions.filter(q => wrongIds.includes(q.id)));
  currentIndex = 0; score = 0; wrongAnswers = [];
  document.getElementById('mode-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('q-total').textContent = questions.length;
  document.getElementById('score-count').textContent = 0;
  document.getElementById('test-card').style.display = mode === 'test' ? 'block' : 'none';
  document.getElementById('input-card').style.display = mode === 'input' ? 'block' : 'none';
  document.getElementById('reverse-card').style.display = 'none';
  document.getElementById('study-card').style.display = 'none';
  if (mode === 'test') showTestQuestion();
  else showInputQuestion();
}

function startMode(m) {
  isWrongReview = false;
  mode = m;
  const range = document.getElementById('range-select').value;
  const doShuffle = document.getElementById('shuffle-check').checked;

  let filtered = allQuestions;
  if (range !== 'all') {
    const [start, end] = range.split('-').map(Number);
    filtered = allQuestions.filter(q => q.id >= start && q.id <= end);
  }
  questions = doShuffle ? shuffle(filtered) : [...filtered];
  currentIndex = 0;
  score = 0;
  wrongAnswers = [];

  document.getElementById('mode-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('quiz-screen').style.display = 'block';
  document.getElementById('q-total').textContent = questions.length;
  document.getElementById('score-count').textContent = 0;

  document.getElementById('test-card').style.display = 'none';
  document.getElementById('input-card').style.display = 'none';
  document.getElementById('reverse-card').style.display = 'none';
  document.getElementById('study-card').style.display = 'none';

  if (mode === 'test') {
    document.getElementById('test-card').style.display = 'block';
    showTestQuestion();
  } else if (mode === 'input') {
    document.getElementById('input-card').style.display = 'block';
    showInputQuestion();
  } else if (mode === 'reverse') {
    document.getElementById('reverse-card').style.display = 'block';
    showReverseQuestion();
  } else {
    document.getElementById('study-card').style.display = 'block';
    showStudyQuestion();
  }
}

function generateEventChoices(correctEvent) {
  const others = allQuestions
    .map(q => q.event)
    .filter(e => e !== correctEvent);
  const pool = shuffle(others).slice(0, 3);
  return shuffle([correctEvent, ...pool]);
}

function showInputQuestion() {
  const q = questions[currentIndex];
  answered = false;
  const input = document.getElementById('year-input');
  input.value = '';
  input.className = 'year-input';
  input.disabled = false;
  document.getElementById('input-feedback').textContent = '';
  document.getElementById('input-feedback').className = 'feedback';
  document.getElementById('submit-btn').disabled = false;
  document.getElementById('input-event-display').textContent = q.event;
  document.getElementById('input-event-desc').textContent = q.desc;
  document.getElementById('input-q-num').textContent = `問${currentIndex + 1}`;
  document.getElementById('q-num').textContent = currentIndex + 1;
  updateProgress();
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('back-btn').style.display = currentIndex > 0 ? 'inline-block' : 'none';
  setTimeout(() => input.focus(), 100);
}

function checkInputAnswer() {
  if (answered) return;
  const input = document.getElementById('year-input');
  const userYear = parseInt(input.value);
  if (!userYear) return;
  answered = true;
  input.disabled = true;
  document.getElementById('submit-btn').disabled = true;
  const correctYear = questions[currentIndex].year;
  const qId = questions[currentIndex].id;
  const feedback = document.getElementById('input-feedback');
  if (userYear === correctYear) {
    input.className = 'year-input correct';
    feedback.textContent = '⭕ 正解！';
    feedback.className = 'feedback correct';
    score++;
    document.getElementById('score-count').textContent = score;
    markCorrect(qId);
  } else {
    input.className = 'year-input wrong';
    feedback.textContent = `❌ 不正解　正解は ${correctYear} 年`;
    feedback.className = 'feedback wrong';
    wrongAnswers.push({ ...questions[currentIndex], userYear });
    markWrong(qId);
  }
  document.getElementById('next-btn').style.display = 'inline-block';
  document.getElementById('next-btn').textContent =
    currentIndex < questions.length - 1 ? '次へ ▶' : '結果を見る';
}

function showReverseQuestion() {
  const q = questions[currentIndex];
  answered = false;
  document.getElementById('reverse-feedback').textContent = '';
  document.getElementById('reverse-feedback').className = 'feedback';
  document.getElementById('reverse-year-display').textContent = q.year + ' 年';
  document.getElementById('reverse-desc').textContent = '';
  document.getElementById('reverse-desc').style.display = 'none';
  document.getElementById('reverse-q-num').textContent = `問${currentIndex + 1}`;
  document.getElementById('q-num').textContent = currentIndex + 1;
  updateProgress();
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('back-btn').style.display = currentIndex > 0 ? 'inline-block' : 'none';

  const choices = generateEventChoices(q.event);
  const container = document.getElementById('reverse-choices');
  container.innerHTML = '';
  choices.forEach(e => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = e;
    btn.addEventListener('click', () => checkReverseAnswer(btn, e));
    container.appendChild(btn);
  });
}

function checkReverseAnswer(btnEl, selectedEvent) {
  if (answered) return;
  answered = true;
  const correctEvent = questions[currentIndex].event;
  const buttons = document.querySelectorAll('#reverse-choices .choice-btn');

  buttons.forEach(btn => {
    btn.disabled = true;
    if (btn.textContent === correctEvent) btn.classList.add('reveal');
  });

  const descEl = document.getElementById('reverse-desc');
  descEl.textContent = questions[currentIndex].desc;
  descEl.style.display = 'block';

  const feedback = document.getElementById('reverse-feedback');
  const qId = questions[currentIndex].id;
  if (selectedEvent === correctEvent) {
    document.querySelector('#reverse-choices .choice-btn.reveal').classList.replace('reveal', 'correct');
    feedback.textContent = '⭕ 正解！';
    feedback.className = 'feedback correct';
    score++;
    document.getElementById('score-count').textContent = score;
    markCorrect(qId);
  } else {
    btnEl.classList.add('wrong');
    feedback.textContent = `❌ 不正解　正解は「${correctEvent}」`;
    feedback.className = 'feedback wrong';
    wrongAnswers.push({ ...questions[currentIndex], selectedEvent });
    markWrong(qId);
  }

  if (currentIndex < questions.length - 1) {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = '次へ ▶';
  } else {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = '結果を見る';
  }
}

function generateChoices(correctYear) {
  const otherYears = allQuestions
    .map(q => q.year)
    .filter(y => y !== correctYear);
  const pool = shuffle(otherYears).slice(0, 3);
  return shuffle([correctYear, ...pool]);
}

function showTestQuestion() {
  const q = questions[currentIndex];
  answered = false;
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('event-display').textContent = q.event;
  document.getElementById('event-desc').textContent = q.desc;
  document.getElementById('test-q-num').textContent = `問${currentIndex + 1}`;
  document.getElementById('q-num').textContent = currentIndex + 1;
  updateProgress();
  document.getElementById('next-btn').style.display = 'none';
  document.getElementById('back-btn').style.display = currentIndex > 0 ? 'inline-block' : 'none';

  const choices = generateChoices(q.year);
  const container = document.getElementById('choices');
  container.innerHTML = choices.map(y =>
    `<button class="choice-btn" onclick="checkAnswer(${y})">${y}年</button>`
  ).join('');
}

function checkAnswer(selectedYear) {
  if (answered) return;
  answered = true;
  const correctYear = questions[currentIndex].year;
  const buttons = document.querySelectorAll('.choice-btn');

  buttons.forEach(btn => {
    btn.disabled = true;
    const y = parseInt(btn.textContent);
    if (y === correctYear) btn.classList.add('reveal');
  });

  const feedback = document.getElementById('feedback');
  const qId = questions[currentIndex].id;
  if (selectedYear === correctYear) {
    document.querySelector(`.choice-btn.reveal`).classList.replace('reveal', 'correct');
    feedback.textContent = '⭕ 正解！';
    feedback.className = 'feedback correct';
    score++;
    document.getElementById('score-count').textContent = score;
    markCorrect(qId);
  } else {
    document.querySelectorAll('.choice-btn').forEach(btn => {
      if (parseInt(btn.textContent) === selectedYear) btn.classList.add('wrong');
    });
    feedback.textContent = `❌ 不正解　正解は ${correctYear} 年`;
    feedback.className = 'feedback wrong';
    wrongAnswers.push({ ...questions[currentIndex], selectedYear });
    markWrong(qId);
  }

  if (currentIndex < questions.length - 1) {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = '次へ ▶';
  } else {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = '結果を見る';
  }
}

function showStudyQuestion() {
  const q = questions[currentIndex];
  yearRevealed = false;
  const yearEl = document.getElementById('study-year');
  yearEl.textContent = 'タップして確認';
  yearEl.className = 'study-year-hidden';
  document.getElementById('study-event').textContent = q.event;
  document.getElementById('study-desc').textContent = q.desc;
  document.getElementById('study-q-num').textContent = `${currentIndex + 1} / ${questions.length}`;
  document.getElementById('q-num').textContent = currentIndex + 1;
  updateProgress();

  document.getElementById('back-btn').style.display = currentIndex > 0 ? 'inline-block' : 'none';
  if (currentIndex < questions.length - 1) {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = '次へ ▶';
  } else {
    document.getElementById('next-btn').style.display = 'inline-block';
    document.getElementById('next-btn').textContent = '完了';
  }
}

function revealYear() {
  if (yearRevealed) return;
  yearRevealed = true;
  const yearEl = document.getElementById('study-year');
  yearEl.textContent = questions[currentIndex].year + ' 年';
  yearEl.className = 'study-year-hidden study-year-revealed';
}

function goNext() {
  if ((mode === 'test' || mode === 'input' || mode === 'reverse') && !answered) return;
  if (currentIndex >= questions.length - 1) { showScore(); return; }
  currentIndex++;
  if (mode === 'test') showTestQuestion();
  else if (mode === 'input') showInputQuestion();
  else if (mode === 'reverse') showReverseQuestion();
  else showStudyQuestion();
}

function goBack() {
  if (currentIndex <= 0) return;
  currentIndex--;
  if (mode === 'test') showTestQuestion();
  else if (mode === 'input') showInputQuestion();
  else if (mode === 'reverse') showReverseQuestion();
  else showStudyQuestion();
}

function updateProgress() {
  const pct = ((currentIndex + 1) / questions.length) * 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

function showScore() {
  document.getElementById('quiz-screen').style.display = 'none';
  const scoreScreen = document.getElementById('score-screen');
  scoreScreen.style.display = 'block';

  if (mode === 'study') {
    document.getElementById('final-score').textContent = '完了';
    document.getElementById('final-total').textContent = questions.length + '問';
    document.getElementById('score-msg').textContent = 'お疲れさまでした！';
    document.getElementById('wrong-list').innerHTML = '';
    return;
  }

  const total = questions.length;
  const pct = Math.round(score / total * 100);
  document.getElementById('final-score').textContent = score;
  document.getElementById('final-total').textContent = total;

  let msg = '';
  if (pct === 100) msg = '🎉 完璧！満点です！';
  else if (pct >= 80) msg = '優秀！あと少しで満点です。';
  else if (pct >= 60) msg = '合格ライン！引き続き頑張ろう。';
  else msg = '復習が必要です。もう一度チャレンジ！';
  document.getElementById('score-msg').textContent = msg;

  const wrongList = document.getElementById('wrong-list');
  if (wrongAnswers.length > 0) {
    const isReverse = mode === 'reverse';
    wrongList.innerHTML = `<div class="wrong-list"><h3>間違えた問題（${wrongAnswers.length}問）</h3>` +
      wrongAnswers.map(w => isReverse
        ? `<div class="wrong-item">${w.year}年 &nbsp; <span>${w.event}</span></div>`
        : `<div class="wrong-item">${w.event} &nbsp; <span>${w.year}年</span></div>`
      ).join('') + '</div>';
  } else {
    wrongList.innerHTML = '';
  }
}

function backToMenu() {
  document.getElementById('quiz-screen').style.display = 'none';
  document.getElementById('score-screen').style.display = 'none';
  document.getElementById('mode-screen').style.display = 'block';
}

function addTap(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  el.addEventListener('touchend', e => { e.preventDefault(); fn(); });
  el.addEventListener('click', fn);
}

addTap('btn-test',         () => startMode('test'));
addTap('btn-input',        () => startMode('input'));
addTap('btn-reverse',      () => startMode('reverse'));
addTap('btn-study',        () => startMode('study'));
addTap('btn-wrong-4択',  () => startWrongReview('test'));
addTap('btn-wrong-input', () => startWrongReview('input'));
addTap('btn-clear-wrong',  () => {
  if (confirm('苦手リストをリセットしますか？')) {
    localStorage.removeItem(STORAGE_KEY);
    updateWrongBtn();
  }
});
addTap('btn-menu',    backToMenu);
addTap('btn-retry',   backToMenu);
addTap('back-btn',    goBack);
addTap('next-btn',    goNext);

updateWrongBtn();

addTap('submit-btn', checkInputAnswer);

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (mode === 'input' && !answered) checkInputAnswer();
    else if (answered) goNext();
  }
});
</script>
</body>
</html>
